name: athar
description: "Athar (أثر) — offline-first bilingual prayer habit tracker."
publish_to: 'none'
version: 1.0.5+5

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get:
  get_storage:
  dio:
  adhan:
  intl:
  fl_chart:
  flutter_local_notifications:
  workmanager:
  firebase_core:
  firebase_messaging:
  geolocator:
  permission_handler:
  google_fonts:
  flutter_timezone:
  timezone:
  audioplayers:
  device_info_plus:
  upgrader:
  share_plus:
  image_picker:
  path_provider:
  confetti: ^0.7.0
  package_info_plus:
  url_launcher:
  flutter_svg:
  flutter_cache_manager:
  sensors_plus: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/frames/
