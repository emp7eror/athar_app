publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get:
  get_storage:
  dio:
  adhan:
  intl:
  fl_chart:
  flutter_local_notifications:
  workmanager:
  firebase_core:
  firebase_messaging:
  geolocator:
  permission_handler:
  google_fonts:
  flutter_timezone:
  timezone:
  audioplayers:
  share_plus:
  image_picker:

dev_dependencies:
  flutter_lints:

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
